name: Build and Release HyperIcons

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Dual-Model Oracle Specification Test Engine
        run: |
          bash run_tests.sh

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure Android SDK build-tools
        run: |
          LATEST_BUILD_TOOLS=$(ls -1d $ANDROID_SDK_ROOT/build-tools/* | sort -V | tail -n 1)
          echo "Using Android build-tools: $LATEST_BUILD_TOOLS"
          echo "$LATEST_BUILD_TOOLS" >> $GITHUB_PATH
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - name: Build APK via build script
        run: |
          chmod +x build.sh
          bash build.sh

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HyperIcons-v5.3.2
          path: HyperIcons.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: HyperIcons ${{ github.ref_name }}
          files: HyperIcons.apk
          generate_release_notes: true
          draft: false
          prerelease: false
