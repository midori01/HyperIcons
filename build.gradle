plugins {
    id 'com.android.application' version '8.2.2'
}

android {
    namespace 'com.midori.hypericons'
    compileSdk 34

    defaultConfig {
        applicationId "com.midori.hypericons"
        minSdk 26
        targetSdk 34
        versionCode 33
        versionName "6.0.0"
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
            resources.srcDirs = ['.']
            resources.includes = ['META-INF/xposed/**']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    compileOnly 'io.github.libxposed:api:102.0.0'
}
